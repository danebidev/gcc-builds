name: Build GCC trunk

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      PREFIX: /opt/gcc
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
    steps:
      - name: Debloat GitHub runner
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: >-
            azure-cli
            google-cloud-cli
            microsoft-edge-stable
            google-chrome-stable
            firefox
            postgresql*
            temurin-*
            *llvm*
            mysql*
            dotnet-sdk-*
          remove_packages_one_command: false
          remove_folders: >-
            /usr/share/swift
            /usr/share/miniconda
            /usr/share/az*
            /usr/local/lib/node_modules
            /usr/local/share/chromium
            /usr/local/share/powershell
            /usr/local/julia
            /usr/local/aws-cli
            /usr/local/aws-sam-cli
            /usr/share/gradle
          testing: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            git \
            ca-certificates \
            flex \
            bison \
            texinfo \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            python3 \
            ccache \
            xz-utils

      - name: ccache dir
        run: |
          mkdir -p $CCACHE_DIR
          chmod -R 777 $CCACHE_DIR

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /ccache
          key: gcc-trunk-ccache-${{ runner.os }}
          restore-keys: |
            gcc-trunk-ccache-

      - name: Clone GCC trunk
        run: |
          git clone --depth=1 https://gcc.gnu.org/git/gcc.git gcc

      - name: Configure
        run: |
          mkdir build
          cd build
          ccache -z

          export CC="ccache gcc"
          export CXX="ccache g++"

          ../gcc/configure \
            --prefix=${PREFIX} \
            --disable-multilib \
            --disable-nls \
            --enable-languages=c,c++ \
            --disable-bootstrap

      - name: Build
        run: |
          cd build
          export CC="ccache gcc"
          export CXX="ccache g++"
          make -j$(nproc)

      - name: Install
        run: |
          cd build
          make install DESTDIR=$PWD/install-root

      - name: Package artifact
        run: |
          tar -czf build/gcc-trunk.tar.gz -C build/install-root .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-trunk
          path: build/gcc-trunk.tar.gz

      - name: ccache stats
        run: ccache -s
